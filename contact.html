<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #eef2f7;
            color: #3a3a4a;
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow: hidden;
        }

        body.dark {
            background-color: #1a1a2e;
            color: #d0d0e0;
        }

        body.dark nav {
            background: rgba(30, 30, 50, 0.75);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        body.dark nav a {
            color: #a0a8c0;
        }

        body.dark nav a:hover,
        body.dark nav a.active {
            background: #2a2a48;
            color: #7eaadf;
            box-shadow: 0 4px 12px rgba(40, 60, 100, 0.3);
        }

        body.dark .lang-divider,
        body.dark .theme-divider {
            background: #3a3a58;
        }

        body.dark .lang-btn:hover,
        body.dark .theme-btn:hover,
        body.dark .lang-btn.active,
        body.dark .theme-btn.active {
            background: #2a2a48;
        }

        body.dark .lang-btn.active,
        body.dark .theme-btn.active {
            border-color: #7eaadf;
        }

        body.dark .about-text {
            background: rgba(30, 30, 50, 0.7);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
        }

        body.dark .about-text h1 {
            color: #7eaadf;
        }

        nav {
            max-width: 820px;
            margin: 30px auto 0;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(100, 120, 160, 0.12);
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        nav a {
            text-decoration: none;
            color: #4a5568;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 10px 24px;
            border-radius: 12px;
            transition: background 0.3s ease, color 0.3s ease, transform 0.25s ease, box-shadow 0.3s ease;
        }

        nav a:hover {
            background: #d6e4f5;
            color: #2b5ea7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(100, 140, 200, 0.18);
        }

        nav a.active {
            background: #c4d8f0;
            color: #2b5ea7;
        }

        .lang-divider,
        .theme-divider {
            width: 1px;
            height: 20px;
            background: #c4d0e0;
            margin: 0 8px;
            transition: background 0.4s ease;
        }

        .lang-switcher,
        .theme-switcher {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .lang-btn,
        .theme-btn {
            background: none;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 4px;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            transition: transform 0.25s ease, border-color 0.3s ease, background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lang-btn:hover,
        .theme-btn:hover {
            transform: translateY(-2px);
            background: #d6e4f5;
        }

        .lang-btn.active,
        .theme-btn.active {
            border-color: #2b5ea7;
            background: #c4d8f0;
        }

        .container {
            max-width: 860px;
            margin: 40px auto;
            padding: 0 20px 60px;
        }

        .about-text {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 6px 24px rgba(100, 130, 180, 0.1);
            line-height: 1.75;
            font-size: 0.95rem;
            text-align: justify;
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        .about-text h1 {
            font-size: 1.6rem;
            color: #2b5ea7;
            margin-bottom: 16px;
            font-weight: 700;
            transition: color 0.4s ease;
        }

        @media (max-width: 640px) {
            nav {
                flex-wrap: wrap;
                margin: 16px 20px 0;
            }
            nav a {
                padding: 8px 16px;
                font-size: 0.88rem;
            }
            .container {
                padding: 0 20px 40px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="theme-switcher">
            <button class="theme-btn active" onclick="switchTheme('light')" title="Light Mode">☀️</button>
            <button class="theme-btn" onclick="switchTheme('dark')" title="Dark Mode">🌙</button>
        </div>

        <div class="theme-divider"></div>

        <a href="index.html" data-en="About Me" data-pl="O mnie">About Me</a>
        <a href="projects.html" data-en="Projects" data-pl="Projekty">Projects</a>
        <!--<a href="blog.html" data-en="Blog" data-pl="Blog">Blog</a>-->
        <a href="contact.html" class="active" data-en="Contact" data-pl="Kontakt">Contact</a>

        <div class="lang-divider"></div>

        <div class="lang-switcher">
            <button class="lang-btn active" onclick="switchLang('en')" title="English">🇬🇧</button>
            <button class="lang-btn" onclick="switchLang('pl')" title="Polski">🇵🇱</button>
        </div>
    </nav>

    <div class="container">
        <div class="about-text">
            <h1 data-en="Contact" data-pl="Kontakt"></h1>
            <p data-en="Feel free to send me an e-mail at anna.m.szymkowiak@gmail.com!"
               data-pl="Pisz śmiało na maila anna.m.szymkowiak@gmail.com!">
            </p>
        </div>
    </div>

    <script>
        function switchTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }

            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.theme-btn[onclick="switchTheme('${theme}')"]`).classList.add('active');

            localStorage.setItem('theme', theme);
        }

        function switchLang(lang) {
            document.querySelectorAll('[data-en][data-pl]').forEach(el => {
                el.textContent = el.getAttribute('data-' + lang);
            });

            document.documentElement.lang = lang;
            document.title = lang === 'pl' ? 'Kontakt' : 'Contact';

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.lang-btn[onclick="switchLang('${lang}')"]`).classList.add('active');

            localStorage.setItem('lang', lang);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme && savedTheme !== 'light') switchTheme(savedTheme);

            const savedLang = localStorage.getItem('lang') || 'en';
            switchLang(savedLang);
        });
    </script>

</body>
</html>
