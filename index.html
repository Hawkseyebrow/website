<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>
    
<body class="preload">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
        }
    </script>

    <nav>
        <div class="theme-switcher">
            <button class="theme-btn active" onclick="switchTheme('light')" title="Light Mode">☀️</button>
            <button class="theme-btn" onclick="switchTheme('dark')" title="Dark Mode">🌙</button>
        </div>

        <div class="theme-divider"></div>

        <a href="./" class="active" data-en="About Me" data-pl="O mnie">About Me</a>
        <a href="projects" data-en="Projects" data-pl="Projekty">Projects</a>
        <!--<a href="blog.html" data-en="Blog" data-pl="Blog">Blog</a>-->
        <a href="contact" data-en="Contact" data-pl="Kontakt">Contact</a>

        <div class="lang-divider"></div>

        <div class="lang-switcher">
            <button class="lang-btn active" onclick="switchLang('en')" title="English">🇬🇧</button>
            <button class="lang-btn" onclick="switchLang('pl')" title="Polski">🇵🇱</button>
        </div>
    </nav>

    <div class="container">
        <div class="about-text">
            <h1 data-en="About Me" data-pl="O mnie"></h1>
            <p data-en="Hi, I'm Anna Szymkowiak, a Polish-English translator and a gamer who especially enjoys indie games."
               data-pl="Hej, tu Anna Szymkowiak. Jestem tłumaczem języka angielskiego i graczem, który szczególnie upodobał sobie gry indie.">
            </p>
            <br>
            <p data-en="You might know me also as Hawkseyebrow. I'm always open to cooperation on some interesting projects, so don't hesitate to reach out!"
               data-pl="Możesz mnie również kojarzyć jako Hawkseyebrow. Zawsze jestem otwarta na współpracę nad jakimś ciekawym projektem, więc nie wahaj się do mnie napisać!">
            </p>
        </div>
    </div>

</body>
</html>
